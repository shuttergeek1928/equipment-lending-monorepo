spring.application.name=user auth and roles

# Server Configuration
server.port=8081
#spring.application.name=auth-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=dbadmin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT Secret Configuration
# IMPORTANT: Use a strong, random string in production
school.app.jwtSecret=SuperSecretKeyForSchoolLendingJWTs
school.app.jwtExpirationMs=86400000

# Always run data.sql on startup
#spring.sql.init.mode=always